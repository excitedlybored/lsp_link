<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal workflow visualization example</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --text: #172033;
      --muted: #5f6b7c;
      --border: #cbd5e1;
      --edge: #64748b;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --activity: #047857;
      --activity-soft: #d1fae5;
      --handler: #7c3aed;
      --handler-soft: #ede9fe;
      --failure: #b42318;
      --failure-soft: #fee4e2;
      --code: #a15c00;
      --code-soft: #fef3c7;
      --focus: #0ea5e9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1020;
        --surface: #121a2b;
        --surface-soft: #1a2438;
        --text: #e7edf8;
        --muted: #a7b1c2;
        --border: #334155;
        --edge: #94a3b8;
        --primary: #7aa2ff;
        --primary-soft: #172b55;
        --activity: #5ee2ae;
        --activity-soft: #123b30;
        --handler: #c4a7ff;
        --handler-soft: #302353;
        --failure: #ff8a80;
        --failure-soft: #4b2024;
        --code: #fbbf6b;
        --code-soft: #422f12;
        --focus: #38bdf8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 600; }
    h2 { margin-bottom: 12px; font-size: 1rem; font-weight: 600; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin-bottom: 0; }

    .metrics {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .875rem;
    }

    .metrics strong { color: var(--text); font-weight: 600; }

    .workflow-picker {
      display: grid;
      gap: 5px;
      min-width: 240px;
      color: var(--muted);
      font-size: .75rem;
    }

    .workflow-picker select {
      width: 100%;
      min-height: 40px;
      padding: 8px 34px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: .9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 22px;
      align-items: start;
    }

    .diagram-wrap,
    .evidence {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .diagram-wrap { padding: 12px; }

    #workflow-diagram {
      display: block;
      width: 100%;
      height: auto;
      min-height: 780px;
    }

    .evidence {
      position: sticky;
      top: 20px;
      padding: 20px;
    }

    .kind {
      display: inline-block;
      margin-bottom: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .evidence dl { margin: 18px 0 0; }
    .evidence dt { margin-top: 14px; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    .evidence dd { margin: 4px 0 0; overflow-wrap: anywhere; }
    .evidence code { color: var(--code); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }

    .code-record {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .code-record:first-child { border-top: 0; }
    .code-record strong { display: block; margin-bottom: 3px; font-size: .8rem; font-weight: 600; }
    .code-record code { display: block; overflow-wrap: anywhere; word-break: break-word; }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: .8rem;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--primary-soft); border: 1px solid var(--primary); }
    .swatch.activity { background: var(--activity-soft); border-color: var(--activity); }
    .swatch.handler { background: var(--handler-soft); border-color: var(--handler); }
    .swatch.failure { background: var(--failure-soft); border-color: var(--failure); }

    .flow-edge { stroke: var(--edge); stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .flow-edge.handler { stroke: var(--handler); stroke-dasharray: 6 5; }
    .flow-edge.failure { stroke: var(--failure); stroke-dasharray: 7 5; }
    .edge-label { fill: var(--muted); font-size: 11px; text-anchor: middle; }

    .workflow-node {
      width: 100%;
      height: 100%;
      padding: 5px 8px;
      border: 1.5px solid var(--primary);
      border-radius: 9px;
      background: var(--primary-soft);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
    }

    .workflow-node.activity { border-color: var(--activity); background: var(--activity-soft); }
    .workflow-node.handler { border-color: var(--handler); background: var(--handler-soft); }
    .workflow-node.failure { border-color: var(--failure); background: var(--failure-soft); }
    .workflow-node[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--focus); }

    .workflow-node small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .evidence { position: static; }
      #workflow-diagram { min-height: 720px; }
    }

    @media (max-width: 560px) {
      .shell { padding: 16px; }
      header { align-items: flex-start; flex-direction: column; }
      .diagram-wrap { padding: 4px; }
      #workflow-diagram { min-height: 620px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1 id="page-title">Temporal workflows</h1>
        <p class="subtitle">Workflow-first view with connected Java evidence</p>
      </div>
      <label class="workflow-picker" for="workflow-select">
        Select workflow
        <select id="workflow-select" aria-label="Select workflow"></select>
      </label>
      <div class="metrics" aria-label="Diagram summary" aria-live="polite">
        <span><strong id="metric-workflows">60</strong> workflows</span>
        <span><strong id="metric-nodes">0</strong> nodes shown</span>
        <span><strong id="metric-edges">0</strong> relations</span>
      </div>
    </header>

    <div class="layout">
      <section aria-labelledby="diagram-title">
        <h2 id="diagram-title" class="sr-only">Booking workflow diagram</h2>
        <div class="diagram-wrap">
          <svg id="workflow-diagram" viewBox="0 0 790 1120" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Selected Temporal workflow</title>
            <desc id="svg-desc">Select a workflow node to inspect the Java contract, implementation class, method, and source evidence behind it.</desc>
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
              </marker>
            </defs>
            <g id="edges"></g>
            <g id="nodes"></g>
          </svg>
        </div>
        <div class="legend" aria-label="Node legend">
          <span><i class="swatch"></i>Workflow step</span>
          <span><i class="swatch activity"></i>Activity</span>
          <span><i class="swatch handler"></i>Handler</span>
          <span><i class="swatch failure"></i>Compensation</span>
        </div>
      </section>

      <aside class="evidence" aria-labelledby="evidence-heading" aria-live="polite">
        <span id="evidence-kind" class="kind">Workflow</span>
        <h2 id="evidence-heading">Select a node</h2>
        <p id="evidence-description" class="muted">Java evidence for the selected workflow concept appears here.</p>
        <div id="code-evidence-list"></div>
      </aside>
    </div>
  </main>

  <script type="text/plain" id="single-example-script">
    const nodes = [
      { id: "workflow", x: 290, y: 25, w: 180, h: 58, label: "Booking workflow", sub: "Temporal workflow", kind: "workflow", description: "Coordinates validation, reservation, payment, booking, a child workflow, completion, and compensation.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "execute(Workflow0056Request)", source: "@WorkflowInterface, @WorkflowMethod, BYTECODE_INTERFACE" },
      { id: "signals", x: 40, y: 120, w: 190, h: 58, label: "Cancel · Pause · Resume", sub: "Signal handlers", kind: "handler", description: "Asynchronous commands that mutate the running workflow state.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "cancel(), pause(), resume()", source: "@SignalMethod and resolved implementation methods" },
      { id: "queries", x: 285, y: 120, w: 190, h: 58, label: "Status · Audit trail", sub: "Query handlers", kind: "handler", description: "Read-only views into workflow status and accumulated audit history.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "status(), auditTrail()", source: "@QueryMethod and resolved implementation methods" },
      { id: "updates", x: 530, y: 120, w: 190, h: 58, label: "Adjust · Amend", sub: "Update handlers", kind: "handler", description: "Validated changes applied while the workflow is running.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "adjustAmount(), amendReference()", source: "@UpdateMethod and resolved implementation methods" },
      { id: "execute", x: 290, y: 220, w: 180, h: 58, label: "Execute", sub: "Workflow entry point", kind: "workflow", description: "Starts the durable orchestration and calls the workflow's internal steps.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "execute(Workflow0056Request)", source: "@WorkflowMethod and JVM call sites" },
      { id: "validate", x: 290, y: 320, w: 180, h: 58, label: "Validate and load", sub: "Workflow step", kind: "workflow", description: "Validates the request and loads the customer profile with retry behavior.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "validateAndLoad()", source: "JvmMethod and resolved bytecode calls" },
      { id: "validateActivity", x: 530, y: 320, w: 190, h: 58, label: "Validate · Load profile", sub: "Activities", kind: "activity", description: "External validation and profile-loading operations invoked by the workflow.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "validate(), loadProfile()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "risk", x: 290, y: 420, w: 180, h: 58, label: "Assess risk", sub: "Workflow step", kind: "workflow", description: "Coordinates risk evaluation before reserving capacity.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "assessRisk()", source: "JvmMethod and resolved bytecode calls" },
      { id: "riskActivity", x: 530, y: 420, w: 190, h: 58, label: "Screen risk", sub: "Activity", kind: "activity", description: "Runs the external risk screening activity.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "screenRisk()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "reserve", x: 290, y: 520, w: 180, h: 58, label: "Reserve capacity", sub: "Workflow step", kind: "workflow", description: "Waits for an active state and reserves required capacity.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "reserveCapacity()", source: "JvmMethod, Workflow.await, and resolved activity call" },
      { id: "reserveActivity", x: 530, y: 520, w: 190, h: 58, label: "Reserve", sub: "Activity", kind: "activity", description: "Creates the external capacity reservation.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "reserve()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "authorize", x: 290, y: 620, w: 180, h: 58, label: "Authorize payment", sub: "Workflow step", kind: "workflow", description: "Checks cancellation state and requests payment authorization.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "authorizePayment()", source: "JvmMethod and resolved activity call" },
      { id: "authorizeActivity", x: 530, y: 620, w: 190, h: 58, label: "Authorize", sub: "Activity", kind: "activity", description: "Performs external payment authorization.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "authorize()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "book", x: 290, y: 720, w: 180, h: 58, label: "Book with retry", sub: "Workflow step", kind: "workflow", description: "Attempts the booking and uses a durable Temporal timer before retrying.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "bookWithRetry()", source: "JvmMethod, Workflow timer API, and resolved activity call" },
      { id: "bookActivity", x: 530, y: 720, w: 190, h: 58, label: "Book", sub: "Activity", kind: "activity", description: "Creates the external booking.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "book()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "compensate", x: 40, y: 820, w: 190, h: 58, label: "Compensate failure", sub: "Failure path", kind: "failure", description: "Reverses completed side effects after a booking failure.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "compensateFailure()", source: "JvmMethod and resolved compensation calls" },
      { id: "release", x: 40, y: 920, w: 190, h: 58, label: "Release · Reverse", sub: "Compensation activities", kind: "failure", description: "Releases capacity and reverses payment authorization.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "release(), reverseAuthorization()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "child", x: 290, y: 820, w: 180, h: 58, label: "Coordinate child", sub: "Workflow step", kind: "workflow", description: "Creates a typed child-workflow stub and invokes its workflow entry point.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "coordinateChildIfRequired()", source: "Workflow.newChildWorkflowStub and typed workflow call" },
      { id: "childWorkflow", x: 530, y: 820, w: 190, h: 58, label: "Child workflow", sub: "Execute", kind: "workflow", description: "A child Temporal workflow invoked through its annotated contract.", contract: "ChildWorkflowContract", implementation: "ChildWorkflowImpl", method: "execute()", source: "@WorkflowMethod and BYTECODE_RESOLVES_TO" },
      { id: "complete", x: 290, y: 920, w: 180, h: 58, label: "Complete booking", sub: "Workflow step", kind: "workflow", description: "Transitions the workflow to completion and sends notification.", contract: "Workflow0056Contract", implementation: "Workflow0056Impl", method: "completeBooking()", source: "JvmMethod and resolved activity call" },
      { id: "notify", x: 530, y: 920, w: 190, h: 58, label: "Notify completion", sub: "Activity", kind: "activity", description: "Notifies downstream systems that booking completed.", contract: "Workflow0056Activities", implementation: "Workflow0056ActivityImpl", method: "notifyCompletion()", source: "@ActivityInterface and BYTECODE_RESOLVES_TO" },
      { id: "done", x: 290, y: 1020, w: 180, h: 58, label: "Completed", sub: "Workflow result", kind: "workflow", description: "Returns the durable result after all required work completes.", contract: "Workflow0056Result", implementation: "Workflow0056Impl", method: "execute() return", source: "Resolved return type and workflow entry-point evidence" }
    ];

    const edges = [
      { from: "workflow", to: "execute", label: "entry point" },
      { from: "workflow", to: "signals", kind: "handler", label: "signals" },
      { from: "workflow", to: "queries", kind: "handler", label: "queries" },
      { from: "workflow", to: "updates", kind: "handler", label: "updates" },
      { from: "execute", to: "validate" },
      { from: "validate", to: "validateActivity", label: "invokes" },
      { from: "validate", to: "risk" },
      { from: "risk", to: "riskActivity", label: "invokes" },
      { from: "risk", to: "reserve" },
      { from: "reserve", to: "reserveActivity", label: "invokes" },
      { from: "reserve", to: "authorize" },
      { from: "authorize", to: "authorizeActivity", label: "invokes" },
      { from: "authorize", to: "book" },
      { from: "book", to: "bookActivity", label: "invokes" },
      { from: "book", to: "compensate", kind: "failure", label: "failure" },
      { from: "compensate", to: "release", kind: "failure", label: "compensates" },
      { from: "book", to: "child" },
      { from: "child", to: "childWorkflow", label: "invokes" },
      { from: "child", to: "complete" },
      { from: "complete", to: "notify", label: "invokes" },
      { from: "complete", to: "done" }
    ];

    const svg = document.getElementById("workflow-diagram");
    const edgeLayer = document.getElementById("edges");
    const nodeLayer = document.getElementById("nodes");
    const nodeById = new Map(nodes.map(node => [node.id, node]));
    const ns = "http://www.w3.org/2000/svg";

    function edgePoints(from, to) {
      const fromCenter = { x: from.x + from.w / 2, y: from.y + from.h / 2 };
      const toCenter = { x: to.x + to.w / 2, y: to.y + to.h / 2 };
      const horizontal = Math.abs(toCenter.x - fromCenter.x) > Math.abs(toCenter.y - fromCenter.y);
      if (horizontal) {
        const rightward = toCenter.x > fromCenter.x;
        return {
          x1: rightward ? from.x + from.w : from.x,
          y1: fromCenter.y,
          x2: rightward ? to.x : to.x + to.w,
          y2: toCenter.y
        };
      }
      const downward = toCenter.y > fromCenter.y;
      return {
        x1: fromCenter.x,
        y1: downward ? from.y + from.h : from.y,
        x2: toCenter.x,
        y2: downward ? to.y : to.y + to.h
      };
    }

    edges.forEach(edge => {
      const from = nodeById.get(edge.from);
      const to = nodeById.get(edge.to);
      const point = edgePoints(from, to);
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", point.x1);
      line.setAttribute("y1", point.y1);
      line.setAttribute("x2", point.x2);
      line.setAttribute("y2", point.y2);
      line.setAttribute("class", `flow-edge ${edge.kind || ""}`);
      edgeLayer.appendChild(line);

      if (edge.label) {
        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", (point.x1 + point.x2) / 2);
        text.setAttribute("y", (point.y1 + point.y2) / 2 - 6);
        text.setAttribute("class", "edge-label");
        text.textContent = edge.label;
        edgeLayer.appendChild(text);
      }
    });

    function selectNode(node) {
      nodeLayer.querySelectorAll("button").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.nodeId === node.id));
      });
      document.getElementById("evidence-kind").textContent = node.sub;
      document.getElementById("evidence-heading").textContent = node.label;
      document.getElementById("evidence-description").textContent = node.description;
      document.getElementById("evidence-contract").textContent = node.contract;
      document.getElementById("evidence-implementation").textContent = node.implementation;
      document.getElementById("evidence-method").textContent = node.method;
      document.getElementById("evidence-source").textContent = node.source;
    }

    nodes.forEach(node => {
      const foreign = document.createElementNS(ns, "foreignObject");
      foreign.setAttribute("x", node.x);
      foreign.setAttribute("y", node.y);
      foreign.setAttribute("width", node.w);
      foreign.setAttribute("height", node.h);
      const button = document.createElement("button");
      button.type = "button";
      button.className = `workflow-node ${node.kind}`;
      button.dataset.nodeId = node.id;
      button.setAttribute("aria-pressed", String(node.id === "workflow"));
      button.setAttribute("aria-label", `${node.label}, ${node.sub}. Show Java evidence.`);
      button.append(document.createTextNode(node.label));
      const small = document.createElement("small");
      small.textContent = node.sub;
      button.appendChild(small);
      button.addEventListener("click", () => selectNode(node));
      foreign.appendChild(button);
      nodeLayer.appendChild(foreign);
    });

    selectNode(nodeById.get("workflow"));

    const svgNamespace = "http://www.w3.org/2000/svg";
    const workflowSelect = document.getElementById("workflow-select");
    const diagram = document.getElementById("workflow-diagram");
    const diagramEdges = document.getElementById("edges");
    const diagramNodes = document.getElementById("nodes");

    async function decodeWorkflowData(encoded) {
      const binary = atob(encoded);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      return JSON.parse(await new Response(stream).text());
    }

    function categoryFor(node) {
      if (["signal_handler", "query_handler", "update_handler"].includes(node.kind)) {
        return "handler";
      }
      if (["activity", "activity_operation", "temporal_operation"].includes(node.kind)) {
        return "activity";
      }
      if (/compensat|release|reverse/i.test(node.label)) {
        return "failure";
      }
      return "workflow";
    }

    function labelForKind(kind) {
      return kind.replaceAll("_", " ").replace(/\b\w/g, character => character.toUpperCase());
    }

    function rankNodes(workflow) {
      const outgoing = new Map();
      workflow.edges.forEach(edge => {
        if (!outgoing.has(edge.source)) outgoing.set(edge.source, []);
        outgoing.get(edge.source).push(edge.target);
      });
      const rank = new Map([[workflow.rootNodeId, 0]]);
      const queue = [workflow.rootNodeId];
      while (queue.length) {
        const source = queue.shift();
        const nextRank = rank.get(source) + 1;
        (outgoing.get(source) || []).forEach(target => {
          if (!rank.has(target)) {
            rank.set(target, nextRank);
            queue.push(target);
          }
        });
      }
      return rank;
    }

    function layoutWorkflow(workflow) {
      const rank = rankNodes(workflow);
      const columns = { handler: [], workflow: [], activity: [] };
      workflow.nodes.forEach(node => {
        const category = categoryFor(node);
        columns[category === "failure" ? "handler" : category].push(node);
      });
      Object.values(columns).forEach(column => column.sort((left, right) => {
        if (left.id === workflow.rootNodeId) return -1;
        if (right.id === workflow.rootNodeId) return 1;
        return (rank.get(left.id) ?? 999) - (rank.get(right.id) ?? 999)
          || left.label.localeCompare(right.label);
      }));

      const positions = new Map();
      const config = {
        handler: { x: 20, width: 220 },
        workflow: { x: 285, width: 220 },
        activity: { x: 550, width: 220 }
      };
      const rowHeight = 64;
      Object.entries(columns).forEach(([category, column]) => {
        column.forEach((node, index) => {
          positions.set(node.id, {
            x: config[category].x,
            y: 24 + index * rowHeight,
            width: config[category].width,
            height: 48,
            category: categoryFor(node)
          });
        });
      });
      const height = Math.max(...Object.values(columns).map(column => column.length), 8)
        * rowHeight + 48;
      return { positions, height };
    }

    function edgeCoordinates(source, target) {
      const sourceCenter = { x: source.x + source.width / 2, y: source.y + source.height / 2 };
      const targetCenter = { x: target.x + target.width / 2, y: target.y + target.height / 2 };
      const horizontal = Math.abs(targetCenter.x - sourceCenter.x) > Math.abs(targetCenter.y - sourceCenter.y);
      if (horizontal) {
        const rightward = targetCenter.x > sourceCenter.x;
        return {
          x1: rightward ? source.x + source.width : source.x,
          y1: sourceCenter.y,
          x2: rightward ? target.x : target.x + target.width,
          y2: targetCenter.y
        };
      }
      const downward = targetCenter.y > sourceCenter.y;
      return {
        x1: sourceCenter.x,
        y1: downward ? source.y + source.height : source.y,
        x2: targetCenter.x,
        y2: downward ? target.y : target.y + target.height
      };
    }

    function showEvidence(node, workflow) {
      diagramNodes.querySelectorAll("button").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.nodeId === node.id));
      });
      document.getElementById("evidence-kind").textContent = labelForKind(node.kind);
      document.getElementById("evidence-heading").textContent = node.label;
      const relationCount = workflow.edges.filter(
        edge => edge.source === node.id || edge.target === node.id
      ).length;
      document.getElementById("evidence-description").textContent =
        `${labelForKind(node.kind)} with ${relationCount} workflow relation${relationCount === 1 ? "" : "s"}.`;
      const list = document.getElementById("code-evidence-list");
      list.replaceChildren();
      if (!node.codeEvidence.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "No Java evidence was resolved for this concept.";
        list.appendChild(empty);
        return;
      }
      node.codeEvidence.forEach(record => {
        const item = document.createElement("div");
        item.className = "code-record";
        const kind = document.createElement("strong");
        kind.textContent = labelForKind(record.kind);
        const identity = document.createElement("code");
        identity.textContent = record.semanticKey || record.label;
        item.append(kind, identity);
        const uri = record.properties && record.properties.uri;
        if (uri) {
          const source = document.createElement("span");
          source.className = "muted";
          source.textContent = uri;
          item.appendChild(source);
        }
        list.appendChild(item);
      });
    }

    function renderWorkflow(workflow) {
      diagramEdges.replaceChildren();
      diagramNodes.replaceChildren();
      const { positions, height } = layoutWorkflow(workflow);
      diagram.setAttribute("viewBox", `0 0 790 ${height}`);
      diagram.style.minHeight = `${Math.min(Math.max(height * 0.72, 720), 1700)}px`;
      document.getElementById("svg-title").textContent = workflow.label;
      document.getElementById("page-title").textContent = workflow.label;
      document.getElementById("metric-nodes").textContent = workflow.nodes.length;
      document.getElementById("metric-edges").textContent = workflow.edges.length;

      workflow.edges.forEach(edge => {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) return;
        const point = edgeCoordinates(source, target);
        const line = document.createElementNS(svgNamespace, "line");
        line.setAttribute("x1", point.x1);
        line.setAttribute("y1", point.y1);
        line.setAttribute("x2", point.x2);
        line.setAttribute("y2", point.y2);
        const endpointFailure = [edge.source, edge.target].some(id => {
          const node = workflow.nodes.find(candidate => candidate.id === id);
          return node && categoryFor(node) === "failure";
        });
        const edgeClass = endpointFailure
          ? "failure"
          : ["SIGNALS", "QUERIES", "UPDATES"].includes(edge.kind) ? "handler" : "";
        line.setAttribute("class", `flow-edge ${edgeClass}`);
        const title = document.createElementNS(svgNamespace, "title");
        title.textContent = `${edge.label} (${edge.observationCount} observations)`;
        line.appendChild(title);
        diagramEdges.appendChild(line);
      });

      workflow.nodes.forEach(node => {
        const position = positions.get(node.id);
        const foreign = document.createElementNS(svgNamespace, "foreignObject");
        foreign.setAttribute("x", position.x);
        foreign.setAttribute("y", position.y);
        foreign.setAttribute("width", position.width);
        foreign.setAttribute("height", position.height);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `workflow-node ${position.category}`;
        button.dataset.nodeId = node.id;
        button.setAttribute("aria-pressed", String(node.id === workflow.rootNodeId));
        button.setAttribute("aria-label", `${node.label}, ${labelForKind(node.kind)}. Show Java evidence.`);
        button.append(document.createTextNode(node.label));
        const detail = document.createElement("small");
        detail.textContent = labelForKind(node.kind);
        button.appendChild(detail);
        button.addEventListener("click", () => showEvidence(node, workflow));
        foreign.appendChild(button);
        diagramNodes.appendChild(foreign);
      });
      showEvidence(
        workflow.nodes.find(node => node.id === workflow.rootNodeId) || workflow.nodes[0],
        workflow
      );
    }

    async function initializeViewer() {
      const data = await decodeWorkflowData(compressedWorkflowData);
      data.workflows = data.w.map(workflow => ({
        label: workflow.l,
        rootNodeId: String(workflow.r),
        nodes: workflow.n.map((node, index) => ({
          id: String(index),
          kind: node.k,
          label: node.l,
          codeEvidence: node.c.map(record => ({
            kind: record.k,
            label: record.l,
            semanticKey: record.s,
            properties: {}
          }))
        })),
        edges: workflow.e.map((edge, index) => ({
          id: String(index),
          kind: edge.k,
          source: String(edge.s),
          target: String(edge.t),
          label: edge.l,
          observationCount: edge.o
        }))
      }));
      data.workflows.sort((left, right) => left.label.localeCompare(right.label));
      document.getElementById("metric-workflows").textContent = data.workflows.length;
      data.workflows.forEach((workflow, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = workflow.label;
        workflowSelect.appendChild(option);
      });
      workflowSelect.addEventListener("change", () => {
        renderWorkflow(data.workflows[Number(workflowSelect.value)]);
      });
      renderWorkflow(data.workflows[0]);
    }

    initializeViewer().catch(error => {
      const alert = document.createElement("p");
      alert.setAttribute("role", "alert");
      alert.textContent = `Unable to load workflow data: ${error.message}`;
      document.querySelector("main").prepend(alert);
    });
  </script>
</body>
</html>
