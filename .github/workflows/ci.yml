name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Ingestion Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java (OpenJDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd lsp_server && npm install
          cd ../gitnexus_ts_isolated && npm install

      - name: Test AST-Only Analysis (Fast fallback)
        run: |
          cd gitnexus_ts_isolated
          npx tsx src/cli/analyze.ts ../sample_projects/spring-boot-demo --no-lsp

      - name: Test Query CLI Interface
        run: |
          cd lsp_server
          npx tsx query.ts --help
