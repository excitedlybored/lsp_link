spring.application.name=device-worker
server.port=8105
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/device_worker}
spring.data.mongodb.auto-index-creation=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.temporal-demo.svc.cluster.local:9092}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=${KAFKA_TOPIC:device-worker.events}
app.temporal.task-queue=${TEMPORAL_TASK_QUEUE:device-worker}
