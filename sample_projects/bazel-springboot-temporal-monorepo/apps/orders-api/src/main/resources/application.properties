spring.application.name=orders-api
server.port=8081
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/bazel_orders}
spring.data.mongodb.auto-index-creation=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.temporal-demo.svc.cluster.local:9092}
app.kafka.topic=${KAFKA_TOPIC:orders-api.events}
spring.kafka.consumer.auto-offset-reset=earliest
